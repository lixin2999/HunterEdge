# sensor_fusion_params.yaml — 多传感器数据融合参数（文档第 6 章）
sensor_fusion:
  ros__parameters:
    lidar_topic: "/perception/lidar_objects"
    vision_topic: "/perception/vision_objects"
    fused_topic: "/perception/fused_objects"
    freespace_topic: "/perception/freespace"

    # 关联匹配（文档 6.2：位置距离 < 2.0m 且类别一致）
    match_distance: 2.0

    # V0.0.86 时间对齐 / 置信度门控（V0.0.89 测试场地调优；V0.1.02 复核）
    # 激光-视觉时间戳最大允许差。实测 Realsense 推理+传输滞后稳定在
    # 0.11~0.15s，旧默认 0.10s 使每一帧都判对齐失败→长期退化 laser_only，
    # 视觉几乎不生效。低速（≤0.5m/s）下 0.20s 内目标位移 <0.1m，可安全放宽。
    # ⚠ V0.1.02 复核结论： 《低速避障方案》§4.3 写"容忍窗口 ±50ms"，本仓【有意
    #   不跟随】。理由：auto_mission 的 OBSTACLE_AVOID/ESTOP 判据（warn 1.5m /
    #   stop 0.6m）消费的正是 /perception/fused_objects，而融合对"超窗口"的处理是
    #   整对丢弃——窗口收到 0.05s 后，CPU 抖动/相机 USB 时延会让融合间歇性无输出，
    #   等于把任务层急停静默关掉（"车不减速撞上去"类事故）。0.5m/s 下 0.20s 失配
    #   仅 = 10cm 位置偏差（远小于车体半宽 0.45m 与诊断边距 0.35m），
    #   而任务层急停可用性远比这 10cm 重要。
    #   收紧前置条件：ros2 topic delay /camera/camera/color/image_raw 无跳变，
    #   且 fused_objects 输出频率不下降，才可按 0.20 → 0.10 → 0.05 逐级收紧。
    max_sync_diff: 0.20
    # V0.1.02：《方案》§4.3 视觉置信度门控 0.5（原 0.45）——抬高后低置信度误检不再
    #   参与融合，减少"视觉幽灵目标"，使"激光 × 融合"交叉验证（假障碍诊断 B 路）更干净。
    vision_conf_min: 0.50     # 视觉置信度门控阈值（低于此不采信视觉）

    # 加权状态融合（文档 6.3）
    pos_lidar_weight: 0.7       # 位置：激光 0.7
    pos_vision_weight: 0.3      # 位置：视觉 0.3
    size_lidar_weight: 0.8      # 尺寸：激光 0.8
    size_vision_weight: 0.2     # 尺寸：视觉 0.2

    # 可行驶区域（文档 6.5）
    freespace_resolution: 0.2   # 栅格分辨率 0.2m
    freespace_length: 40.0      # 车前 40m
    freespace_width: 30.0       # 左右各 15m
    inflation_radius: 0.3       # 膨胀 0.3m

    # 降级阈值
    lidar_timeout: 0.3          # 激光超时（秒）
    vision_timeout: 0.5         # 视觉超时（秒）
