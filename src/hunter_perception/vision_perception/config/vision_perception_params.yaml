# vision_perception_params.yaml — 视觉感知参数（文档 5.2）
# 模型引擎路径、推理参数、相机内参全部 yaml 化
vision_perception:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/depth/image_rect_raw"
    target_frame: "camera_color_optical_frame"   # 文档 7.4 相机光学坐标系

    # TensorRT 引擎（文档 5.2.3：YOLOv8n TensorRT FP16）
    engine_path: "/data/models/yolov8n.engine"
    input_width: 640
    input_height: 640
    conf_threshold: 0.25
    nms_threshold: 0.45

    # D435 RGB 相机内参（用于 2D→3D 投影，需现场标定，文档 5.2.1）
    fx: 615.0
    fy: 615.0
    cx: 320.0
    cy: 240.0

    # 输出频率（文档 5.2.1：15Hz）
    publish_rate: 15.0

    # 异常处理
    timeout: 0.5        # 彩色图像超时阈值（秒）
    min_depth: 0.1      # 深度有效范围下限（m）
    max_depth: 10.0     # 深度有效范围上限（m）
