# Remote Agent parameters
remote_agent:
  ros__parameters:
    vehicle_id: "hunter_001"
    camera_device: "/dev/video0"
    bitrate: 3000000
    srs_host: "127.0.0.1"
    srs_rtp_port: 8000
    ws_url: "wss://platform.example.com/ws/remote"
    cmd_topic: "/remote/command"
    kafka_brokers: "120.202.73.105:9093"
    # Kafka SASL_SSL 认证
    security_protocol: "SASL_SSL"
    sasl_mechanism: "SCRAM-SHA-512"
    sasl_username: "hunter_vehicle"
    sasl_password: "CHANGE_ME"
    ssl_ca_location: "/etc/ssl/certs/ca-certificates.crt"
    max_velocity: 2.0
    max_steering: 0.4
    cmd_timeout: 0.5