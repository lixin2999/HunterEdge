# remote_agent_params.yaml — 遥控 Agent 参数（文档第 13 章 + HunterCore V1.21.0《车端远程操控部署指南》）
#
# ⚠ 安全约定：本文件**不写任何凭据**。Broker / SCRAM 口令 / mTLS 证书路径统一来自
#   /etc/hunter/kafka/kafka.properties（目录 0750 / properties 0640 / 私钥 0600，不入版本库）。
#   remote_agent 为 systemd 服务（非 ROS 节点），启动时按 --config / 本文件覆盖内置默认值。
#
# V0.1.15 视频链路改版（对齐平台 V1.21.0）：旧「rtph264pay → udpsink(8000) 常驻推流」
#   作废，改为**会话制 RTMP 推流**：收到 remote_control boot 帧（video.recording=true）
#   才起 AGX 硬编推到 `srs_rtmp_base_url/<prefix>_<vehicle_id>_<session_id>`（SRS 1935），
#   stop 帧立即停推；浏览器侧经 WHEP(9090) 拉流，车端无需任何 WebRTC 信令。
remote_agent:
  ros__parameters:
    vehicle_id: "HUNTER-001"                          # 留空或与接入包不一致时以 kafka.properties 为准
    kafka_properties: "/etc/hunter/kafka/kafka.properties"
    kafka_bundle_dir: "/etc/hunter/kafka"

    # ── 视频链路（V1.21.0：车端 RTMP 推流 → SRS → 浏览器 WHEP 拉流）──
    # V0.1.19 新增：camera_source 决定帧获取方式
    #   "ros_topic"（默认）：订阅 RealSense 的 ROS 影像话题，避免设备占用冲突
    #   "v4l2"：直接打开 /dev/videoX（仅当有专用摄像头且无其他节点占用时使用）
    camera_source: "ros_topic"
    image_topic: "/camera/camera/color/image_raw"      # V0.1.19 修正：RealSense 节点 /camera/camera 带双层 namespace
    stream_width: 640                                 # ros_topic 模式推流分辨率（建议 ≤640x480 降低带宽）
    stream_height: 480
    prefer_hw_encode: false                           # Jetson 硬编(nvv4l2h264enc)，部分 JetPack 不存在会报 syntax error，默认关
    camera_device: "/dev/video0"                      # 仅 v4l2 模式使用
    enable_video: true                                # 无相机/纯指令联调时可关闭
    srs_rtmp_base_url: "rtmp://192.168.31.35:1935/remote_control"   # SRS RTMP 入口
    srs_stream_prefix: "hunter"                       # = 平台 RC_SRS_STREAM_PREFIX
    video_fps: 15                                     # 匹配 RealSense D435 实际输出（640x480@15fps）
    video_bitrate_kbps: 3000                          # 回落码率（契约 2048~4096 kbps）
    fdsrc_write_timeout_s: 5.0                        # V0.1.21：写 fdsrc 管道时的整帧超时，超时判定推流失败并终止子进程等下次 boot 帧重试

    # ── 遥控指令（主通道 Kafka hunter.<vid>.remote_control，20Hz/50ms）──
    cmd_topic: "/remote/command"
    max_velocity: 2.0                                 # 远程限速 2.0 m/s（安全红线，不可上调）
    max_steering: 0.4                                 # 转向 ±0.4 rad
    cmd_timeout: 3.0                                  # V0.1.19: 平台 Kafka 实际 ~2s/帧（acks=all），3s 容兆底
    remote_cmd_ttl: 4.0                               # 配合 cmd_timeout=3.0，避免 Kafka 延迟抖动误判过期
    ack_command_result: true                          # 逐帧回投 command_result（acks=all；平台 >500ms 无回执判链路异常结束会话）

    # ── WebSocket 备用通道（文档 17.2；需平台 JWT，生产不启用，仅留联调口子）──
    enable_ws: false
    ws_url: "ws://192.168.31.35/ws/remote"            # 经 api-gateway 的备用控制通道
