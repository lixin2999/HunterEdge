# nav2_params.yaml — Nav2 导航栈参数
# 出处：附录 C（控制器）、文档 8.3（代价地图）、9.2（SmacPlannerHybrid）、9.3（footprint）、10.2（RPP）

# ---- 全局定位（map→odom）：AMCL 粒子滤波 ----
# TF 分工：EKF 发布 odom→base_link（ekf_params.yaml publish_tf: true）；
#          AMCL 发布 map→odom（global_costmap / bt_navigator 依赖的缺失环节）。
# scan 输入由 pointcloud_to_laserscan 从 /lidar_points（RS-Helios-16P，frame rslidar）投影生成。
# 初始位姿默认地图原点（假设上电位姿≈建图起点 camera_init）；偏差大时用 rviz2
# "2D Pose Estimate" 向 /initialpose 发布真实位姿重定位。
amcl:
  ros__parameters:
    use_sim_time: False
    # 运动噪声（差速模型近似：HUNTER-SE 阿克曼低速行驶转弯半径大，误差可接受）
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # TF 帧链（odom→base_link 源为 EKF，map→odom 由本节点广播）
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"                # pointcloud_to_laserscan 输出
    map_topic: "/map"                  # map_server 发布（transient local）
    set_initial_pose: true             # 上电自动设初始位姿（地图原点）
    initial_pose:                      # 与建图起点对齐（建图起点 = camera_init 原点 = 地图原点）
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false   # 保留运行中 /initialpose 重定位结果
    # 激光观测模型（likelihood_field，匹配 0.05 m/cell 的 PGM 地图）
    laser_model_type: "likelihood_field"
    laser_min_range: 0.5               # 与传感器 ROI min_range 一致
    laser_max_range: 50.0              # 与传感器 ROI max_range 一致
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # 粒子滤波
    min_particles: 300
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    tf_broadcast: true                 # 广播 map→odom
    transform_tolerance: 1.0
    # 滤波更新阈值（调低：低速导航下位姿及时刷新）
    update_min_a: 0.1
    update_min_d: 0.15

# ---- 全局规划器（文档 9.2 SmacPlannerHybrid，Hybrid-A*） ----
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                          # 文档 9.2：目标点容差
      max_iterations: 1000000                  # 文档 9.2：最大搜索迭代次数
      max_planning_time: 2.0
      motion_model_for_search: "REEDS_SHEPP"   # 文档 9.2：支持前进+倒车
      angle_quantization_bins: 72              # 文档 9.2：航向角量化(5°/bin)
      minimum_turning_radius: 1.9              # 文档 9.2：最小转弯半径(m)
      reverse_penalty: 2.0                     # 文档 9.2：倒车惩罚
      change_penalty: 0.5                      # 文档 9.2：前进/倒车切换惩罚
      downsample_obstacle_heuristic: true      # 文档 9.2：障碍物启发式降采样
      allow_reversing: true
      use_final_approach_orientation: false
      max_robot_pose_search_dist: 5.0

# ---- 局部控制器（附录 C + 文档 10.2 RPP） ----
controller_server:
  ros__parameters:
    controller_frequency: 20.0                 # 附录 C
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      lookahead_dist: 0.6                      # 文档 10.2.2：基础前视距离
      lookahead_time: 1.5                      # 前视时间(速度相关)
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.9
      regulated_linear_scaling_min_speed: 0.2
      max_robot_pose_search_dist: 5.0
      transform_tolerance: 0.1
      # 速度限制（文档 10.2.3）
      desired_linear_vel: 2.0                  # max_velocity 2.0 m/s
      max_linear_accel: 1.0                    # 文档 10.2.3
      max_linear_decel: -1.5                   # 文档 10.2.3

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"   # 必填：缺失即 FATAL "Can not get 'plugin' param value for general_goal_checker"
      stateful: true
      xy_goal_tolerance: 0.1                   # 文档 10.2.3：目标距离容差
      yaw_goal_tolerance: 0.15                 # 文档 10.2.3：目标角度容差

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

# ---- 全局代价地图（文档 8.3） ----
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                    # 文档 8.3：更新频率 1Hz
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1                          # 文档 8.3：分辨率 0.1m
      width: 100                               # 文档 8.3：100m × 100m（Nav2 Humble 要求 integer）
      height: 100
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.37, -0.32], [-0.37, 0.32] ]"   # 文档 9.3
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true    # Humble：map_server 以 transient_local 发 /map，默认 volatile 订阅将收不到地图
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # 必填：loadPlugins() 缺失即 FATAL "Can not get 'plugin' param"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: /perception/lidar/obstacle_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35                 # 文档 8.3 原值 0.3 < footprint 内切半径 0.33，Nav2 强烈警告，取 0.35
        cost_scaling_factor: 3.0

# ---- 局部代价地图（文档 8.3） ----
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0                    # 文档 8.3：更新频率 5Hz
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      resolution: 0.05                         # 文档 8.3：分辨率 0.05m
      width: 10                                # 文档 8.3：10m × 10m（Nav2 Humble 要求 integer）
      height: 10
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.37, -0.32], [-0.37, 0.32] ]"   # 文档 9.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # 必填：loadPlugins() 缺失即 FATAL "Can not get 'plugin' param"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: /perception/lidar/obstacle_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35                 # 文档 8.3 原值 0.2 < footprint 内切半径 0.33（实测 FATAL 前警告），取 0.35
        cost_scaling_factor: 3.0

# ---- 行为树导航器（文档 2.3 nav2_bt_navigator） ----
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_bt_xml_filename: "navigate_to_pose.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

# ---- 速度平滑器（文档 10.2.3 速度限制） ----
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 2.5]     # 文档 10.2.3：max_velocity 2.0
    min_velocity: [-0.5, 0.0, -2.5]   # 文档 10.2.3：min_velocity -0.5
    max_accel: [1.0, 0.0, 3.0]        # 文档 10.2.3：max_accel 1.0
    max_decel: [-1.5, 0.0, -3.0]      # 文档 10.2.3：max_decel -1.5
    odom_topic: "/localization/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

