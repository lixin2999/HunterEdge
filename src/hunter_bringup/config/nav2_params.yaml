# nav2_params.yaml — Nav2 导航栈参数
# 出处：附录 C（控制器）、文档 8.3（代价地图）、9.2（SmacPlannerHybrid）、9.3（footprint）、10.2（RPP）

# ---- 全局定位（map→odom）：AMCL 粒子滤波 ----
# TF 分工：EKF 发布 odom→base_link（ekf_params.yaml publish_tf: true）；
#          AMCL 发布 map→odom（global_costmap / bt_navigator 依赖的缺失环节）。
# scan 输入由 pointcloud_to_laserscan 从 /lidar_points（RS-Helios-16P，frame rslidar）投影生成。
# 初始位姿默认地图原点（假设上电位姿≈建图起点 camera_init）；偏差大时用 rviz2
# "2D Pose Estimate" 向 /initialpose 发布真实位姿重定位。
amcl:
  ros__parameters:
    use_sim_time: False
    # 运动噪声（差速模型近似：HUNTER-SE 阿克曼低速行驶转弯半径大，误差可接受）
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # TF 帧链（odom→base_link 源为 EKF，map→odom 由本节点广播）
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"                # pointcloud_to_laserscan 输出
    map_topic: "/map"                  # map_server 发布（transient local）
    set_initial_pose: true             # 上电自动设初始位姿（地图原点）
    initial_pose:                      # 与建图起点对齐（建图起点 = camera_init 原点 = 地图原点）
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false   # 保留运行中 /initialpose 重定位结果
    # 激光观测模型（likelihood_field，匹配 0.05 m/cell 的 PGM 地图）
    laser_model_type: "likelihood_field"
    laser_min_range: 0.8               # V0.0.89 与 pointcloud_to_laserscan range_min 一致，滤自身反射
    laser_max_range: 50.0              # 与传感器 ROI max_range 一致
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # 粒子滤波
    min_particles: 300
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    tf_broadcast: true                 # 广播 map→odom
    transform_tolerance: 1.0
    # 滤波更新阈值（调低：低速导航下位姿及时刷新）
    update_min_a: 0.1
    update_min_d: 0.15

# ---- 全局规划器（文档 9.2 SmacPlannerHybrid，Hybrid-A*） ----
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                          # 文档 9.2：目标点容差
      max_iterations: 1000000                  # 文档 9.2：最大搜索迭代次数
      max_planning_time: 2.0
      allow_unknown: false                     # V0.0.87 显式声明（Humble 默认 false）：配合
                                               # global_costmap track_unknown_space: true，
                                               # 规划路径不穿越未采集(unknown)区域——
                                               # 行驶路径恒在已采集地图范围内
      motion_model_for_search: "DUBIN"         # V0.0.82：改纯前进。REEDS_SHEPP 允许路径含倒车段，
                                               # 但本 fork RPP 不支持倒车跟随（无 allow_reversing 参数），
                                               # 倒车段会令控制器死磕 → Failed to make progress；
                                               # 倒车需求由 BackUp 恢复行为承担
      angle_quantization_bins: 72              # 文档 9.2：航向角量化(5°/bin)
      minimum_turning_radius: 1.9              # 文档 9.2：最小转弯半径(m)
      reverse_penalty: 2.0                     # 文档 9.2：倒车惩罚（DUBIN 下不生效，保留供回切 REEDS_SHEPP）
      change_penalty: 0.5                      # 文档 9.2：前进/倒车切换惩罚（同上）
      downsample_obstacle_heuristic: true      # 文档 9.2：障碍物启发式降采样
      allow_reversing: false                   # V0.0.82：与 DUBIN 匹配，规划路径不含倒车段
      use_final_approach_orientation: false
      max_robot_pose_search_dist: 5.0

# ---- 局部控制器（附录 C + 文档 10.2 RPP） ----
controller_server:
  ros__parameters:
    controller_frequency: 20.0                 # 附录 C
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      lookahead_dist: 0.6                      # 文档 10.2.2：基础前视距离
      lookahead_time: 1.5                      # 前视时间(速度相关)
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: false             # V0.0.82：阿克曼无法原地旋转。开启时 RPP 在朝向差大
                                               # 时命令 v=0+w，经底盘自行车模型(δ=atan(L·w/v))换算
                                               # 为打满转向(0.58rad)原地不动——"转向迟缓"来源之一；
                                               # 大朝向差由 Smac Hybrid 的前进弧线自然衔接
      rotate_to_heading_min_angle: 0.785       # （use_rotate_to_heading=false 后不生效，保留占位）
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.9
      regulated_linear_scaling_min_speed: 0.1             # V0.0.89 弯道/近障最低速（原 0.2），使窄场地不至于完全停走
      max_robot_pose_search_dist: 5.0
      transform_tolerance: 0.1
      # 速度限制（文档 10.2.3；V0.0.89 窄小测试场地低速档：统一上限 0.5m/s）
      desired_linear_vel: 0.5                  # V0.0.82 原 2.0→0.8；V0.0.89 测试场地→0.5
      max_linear_accel: 0.3                    # V0.0.89 缓起步（原 0.5）
      max_linear_decel: -1.5                   # 0.5m/s 下 -1.5 足够 0.08s 停住，避免点头
      # V0.0.82 显式声明碰撞检测（本 fork 默认 true，参数存在性见
      # regulated_pure_pursuit_controller.cpp:89——检测到投影碰撞即终止
      # FollowPath 进入 BT 恢复，依赖局部 costmap 有障碍数据）
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5   # 0.5m/s 投影 1.5s ≈ 0.75m 前瞻
      use_cost_regulated_linear_velocity_scaling: true  # 近障碍代价降速（依赖障碍层数据）
      cost_scaling_dist: 0.4                   # V0.0.89 窄通道放宽近障降速带（原 0.6 使车在墙边几乎停走）
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_angular_accel: 1.0                   # V0.0.89 低速下调角加速度（原 1.5），防甩尾

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"   # 必填：缺失即 FATAL "Can not get 'plugin' param value for general_goal_checker"
      stateful: true
      xy_goal_tolerance: 0.1                   # 文档 10.2.3：目标距离容差
      yaw_goal_tolerance: 0.15                 # 文档 10.2.3：目标角度容差

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

# ---- 全局代价地图（文档 8.3） ----
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0                    # V0.0.82：原 1.0，配合 BT 2Hz 重规划
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1                          # 文档 8.3：分辨率 0.1m
      width: 100                               # 文档 8.3：100m × 100m（Nav2 Humble 要求 integer）
      height: 100
      # V0.0.87 越界防护（地图边界约束第①层）：保留静态地图中未采集区域为
      # NO_INFORMATION（默认 false 会把 unknown 当作自由空间 → 规划器可穿越
      # 未建图区域）。配合 Smac allow_unknown=false：全局规划路径不进入
      # 未采集区域；目标点在未采集区域/地图外时规划直接失败（BT 快速回报），
      # 不再出现"路径悄悄伸到地图边缘外"的情况
      track_unknown_space: true
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.37, -0.32], [-0.37, 0.32] ]"   # 文档 9.3
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true    # Humble：map_server 以 transient_local 发 /map，默认 volatile 订阅将收不到地图
      # V0.0.82 双障碍源冗余：原单一 lidar_cloud（lidar_perception 聚类输出）
      # 为单点故障——地面分割/聚类异常时障碍层全空 → 全局无避障。补第二源
      # /scan（pointcloud_to_laserscan 高度切片直出，不经聚类，且带清障能力）
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # 必填：loadPlugins() 缺失即 FATAL "Can not get 'plugin' param"
        enabled: true
        observation_sources: "lidar_cloud scan"   # Humble：ObstacleLayer 将该参数声明为空格分隔字符串，写成 YAML 列表会报 string_array 类型冲突
        lidar_cloud:
          topic: /perception/lidar/obstacle_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.3                 # V0.0.89 抬高至底盘/地面之上（原 0.0），避免近地杂波把车脚底标致命
          max_obstacle_height: 1.5
          marking: true
          clearing: false
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.5             # 10Hz 数据，0.5s 无更新仅告警不断链
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true                        # 射线清障：障碍移除后痕迹自动消退
          inf_is_valid: true                    # use_inf 投影的 inf 视为该方向无障碍
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40                 # V0.0.82：原 0.35，加大缓冲（≥内切半径 0.33+余量）
        cost_scaling_factor: 3.0

# ---- 局部代价地图（文档 8.3） ----
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0                   # V0.0.82：原 5.0，高速/贴近障碍场景更快反应
      publish_frequency: 5.0                   # 原 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      resolution: 0.05                         # 文档 8.3：分辨率 0.05m
      width: 10                                # 文档 8.3：10m × 10m（Nav2 Humble 要求 integer）
      height: 10
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.37, -0.32], [-0.37, 0.32] ]"   # 文档 9.3
      plugins: ["obstacle_layer", "inflation_layer"]
      # V0.0.82 双障碍源冗余（与 global_costmap 一致）：单一聚类点云源为
      # 单点故障；/scan 直采源带清障（clearing），感知链任一环异常时另一源兜底
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # 必填：loadPlugins() 缺失即 FATAL "Can not get 'plugin' param"
        enabled: true
        observation_sources: "lidar_cloud scan"   # Humble：ObstacleLayer 将该参数声明为空格分隔字符串，写成 YAML 列表会报 string_array 类型冲突
        lidar_cloud:
          topic: /perception/lidar/obstacle_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.3                 # V0.0.89 抬高至底盘/地面之上（原 0.0），避免近地杂波把车脚底标致命
          max_obstacle_height: 1.5
          marking: true
          clearing: false
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.5
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40                 # V0.0.82：原 0.35，加大缓冲
        cost_scaling_factor: 3.0

# ---- 行为树导航器（文档 2.3 nav2_bt_navigator） ----
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odom
    bt_loop_duration: 20                       # V0.0.82：10ms 在 Jetson 上偏紧（"Behavior Tree tick
                                               # rate was exceeded" 刷屏），放宽到 20ms
    default_server_timeout: 20
    # ⚠️ 勿在此设置 plugin_lib_names：该参数一旦设置将【整体覆盖】bt_navigator 代码
    # 内置的全量 BT 插件列表（nav2_bt_navigator/src/bt_navigator.cpp，49 项）。
    # 旧配置的手写列表缺 nav2_remove_passed_goals_action_bt_node，导致激活时加载
    # 默认 navigate_through_poses_w_replanning_and_recovery.xml 报
    # "Node not recognized: RemovePassedGoals" → lifecycle_manager 中止 bringup。
    # 默认行为树由 bt_navigator 自行解析：可选手动覆盖参数名为
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml（未设置即用默认）。

# ---- 速度平滑器（文档 10.2.3 速度限制；V0.0.82 与 controller/safety_guard 对齐） ----
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.8]     # V0.0.89 测试场地：线速度上限 0.5m/s（原 0.8，与 RPP desired_linear_vel 一致），角速度 0.8rad/s
    min_velocity: [0.0, 0.0, -0.8]    # V0.0.89 线性下限置 0：硬禁止倒车（角速度保留 ± 以转向）
    max_accel: [0.3, 0.0, 1.0]        # V0.0.89 与 RPP 一致，减小起步冲击
    max_decel: [-1.5, 0.0, -1.5]      # V0.0.89 0.5m/s 下足够制动
    odom_topic: "/localization/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5             # 原 1.0：断流 0.5s 即零速（下游 safety_guard 同周期看门狗双保险）

