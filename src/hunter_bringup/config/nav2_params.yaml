# nav2_params.yaml — Nav2 导航栈参数
# 出处：附录 C（控制器）、文档 8.3（代价地图）、9.2（SmacPlannerHybrid）、9.3（footprint）、10.2（MPPI）

# ---- 全局定位（map→odom）：V0.0.93 方案A 已移除 AMCL ----
# 旧方案用 AMCL 2D 粒子滤波匹配 PGM，但大范围/低矮结构场景下因 TF 打架长期不收敛，
# 是"无法自主巡航"根因。方案A 定位链改为：
#   map --hunter_relocalization(NDT 点云配准)--> odom --FAST-LIO2(LIO)--> base_link
# 底盘与 EKF 均 publish_tf=false，不再争抢 odom→base_link。
# 2D PGM 地图仅供 nav2_map_server 作 global_costmap 的 static_layer，不再用于定位。
# （AMCL 节点已从 hunter_autonomous_nav.launch.py 移除；此段参数保留仅作历史参考，不再生效。）
# amcl:
#   ros__parameters:
#     ...  # 已由 hunter_relocalization/config/relocalization_params.yaml 取代

# ---- 全局规划器（文档 9.2 SmacPlannerHybrid，Hybrid-A*） ----
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                          # 文档 9.2：目标点容差
      max_iterations: 1000000                  # 文档 9.2：最大搜索迭代次数
      max_planning_time: 2.0
      allow_unknown: false                     # V0.0.87 显式声明（Humble 默认 false）：配合
                                               # global_costmap track_unknown_space: true，
                                               # 规划路径不穿越未采集(unknown)区域——
                                               # 行驶路径恒在已采集地图范围内
      motion_model_for_search: "REEDS_SHEPP"   # V0.0.97：DUBIN → REEDS_SHEPP（放开倒车段）。
                                               #   几何依据：R_min=1.9m 的阿克曼要绕开正前方障碍，
                                               #   单圆弧所需"提前转向距离" s ≥ √(2R·(半宽0.32+余量0.10))
                                               #   ≈ 1.33m（推导见 Deployment_Guide §绕障几何）；车与障碍
                                               #   距离 <1.33m 时，纯前进无论怎么打舵都会剐蹭（V0.0.96
                                               #   实车日志：车距障碍 1.0m、满舵 0.386rad 死磕 20s 零位移
                                               #   → Failed to make progress 循环）。倒车段用于
                                               #   ①创造 ≥1.33m 提前量 ②多点掉头（前进/倒车交替）。
                                               #   V0.0.82 曾因"本 fork 控制器不支持倒车跟随"退回 DUBIN；
                                               #   V0.0.93 起控制器已换 MPPI，V0.0.97 同步放开
                                               #   MPPI vx_min=-0.20（PathAngleCritic 据此自动允许倒车），
                                               #   侧向/后向安全由 safety_guard【后方走廊】判据兜底。
      angle_quantization_bins: 72              # 文档 9.2：航向角量化(5°/bin)
      minimum_turning_radius: 1.9              # 文档 9.2：最小转弯半径(m)
      reverse_penalty: 1.5                     # 文档 9.2：倒车代价惩罚（V0.0.97 由 2.0 下调）——
                                               #   REEDS_SHEPP 下生效：1.5 使"倒 0.3~0.5m 换取向"
                                               #   仍贵于前进（避免无谓倒车），但便宜到能在窄处
                                               #   被规划器选中（2.0 时规划器宁愿报规划失败）
      change_penalty: 0.3                      # 文档 9.2：前进/倒车切换惩罚（V0.0.97 由 0.5 下调）——
                                               #   多点掉头需 2~3 次方向切换，惩罚过大即退回死锁
      downsample_obstacle_heuristic: true      # 文档 9.2：障碍物启发式降采样
      allow_reversing: true                    # ⚠ 本 fork nav2_smac_planner【没有此参数】（已核对
                                               #   src/navigation2/nav2_smac_planner/src/smac_planner_hybrid.cpp：
                                               #   仅读取 motion_model_for_search / reverse_penalty /
                                               #   change_penalty / minimum_turning_radius）。此行保留
                                               #   仅为与上游 Nav2 配置同名可读，实际不产生任何效果——
                                               #   倒车自由度完全由上方 motion_model_for_search 决定
      use_final_approach_orientation: false
      max_robot_pose_search_dist: 5.0

# ---- 局部控制器（V0.0.93 方案A：RPP → MPPI，模型预测控制，阿克曼友好） ----
# MPPI 在车辆运动学约束下对代价函数做模型预测优化，天然处理阿克曼最小转弯半径、
# 平滑转向、贴近障碍减速，避免 RPP 大朝向差/窄通道"死磕"。低速档参数与 RPP 时代对齐。
controller_server:
  ros__parameters:
    controller_frequency: 20.0                 # 附录 C
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 50                           # V0.0.98：30 → 50。预测时域是"能绕开障碍"
      model_dt: 0.08                           #   的控制层前提：旧 30×0.05=1.5s 前瞻在 0.25m/s
                                               #   绕行参考车速下仅 0.75m < 阿克曼提前转向距离
                                               #   s≥√(2R·c)≈1.33m——MPPI "看不到"完整绕障弧，
                                               #   只能选出贴障碍的贪心解（日志：满舵 0.386rad
                                               #   持续 13~20s 零位移）。现时域 50×0.08=4.0s，
                                               #   0.25m/s 下前瞻 1.0m、0.5m/s 下 2.0m，能覆盖
                                               #   "倒车换提前量→打舵绕过"的完整机动序列；
                                               #   代价：优化变量 50×2 维，配合 batch_size 下调
                                               #   后总算力反而低于旧配置（防 20Hz 丢帧）
      batch_size: 700                          # V0.0.98：1000 → 700（时域加长后的算力对冲：
                                               #   700×50=3.5万 < 旧 1000×30=3万 → 相当；日志
                                               #   "Control loop missed 20Hz" 频发，Jetson 需降载）
      vx_std: 0.2
      vy_std: 0.0                              # 阿克曼无横向速度
      vy_max: 0.0                              # V0.0.97 显式声明：ConstraintCritic 读【父级】
                                               # vy_max（默认 0.5）算反向速度上限
                                               # min_vel_ = -√(vx_min²+vy_max²)，不声明会得到
                                               # -0.54 而放过超速倒车；填 0.0 后恰为 vx_min
      wz_std: 0.5                              # V0.0.98：0.4 → 0.5。绕障本质是打舵横移，
                                               #   转向采样多样性不足时可行弧解碰不到
      vx_max: 0.5                              # 与 desired_linear_vel/velocity_smoother 一致（V0.0.89 低速档）
      vx_min: -0.20                            # V0.0.97：0.0 → -0.20，放开【控制器级低速倒车】
                                               #   几何依据（本参数是"能绕开障碍"的关键，详见
                                               #   Deployment_Guide §绕障几何）：R_min=1.9m 的阿克曼
                                               #   绕开正前方障碍需"提前转向距离"
                                               #   s ≥ √(2R·(半宽0.32+余量0.10)) ≈ 1.33m；
                                               #   车距障碍 <1.33m 时纯前进怎么打舵都会剐蹭——
                                               #   V0.0.96 实车日志正是此情形：车贴障碍 1.0m、
                                               #   满载舵角 0.386rad（=|v|/R_min 限幅值）死磕 20s
                                               #   零位移 → "Failed to make progress" 循环 +
                                               #   行为树倒车 0.45m 后又贴回 → FAULT 锁存。
                                               #   倒车用于 ①先退到 ≥1.33m 提前量 ②多点掉头
                                               #   （前进/倒车交替，单段倒车 ≤0.5m）。
                                               #   物理兜底：safety_guard 检测 v<0 时切【后方走廊】
                                               #   判据（后净空 < stop_dist 即零速）+ 地图边界监护；
                                               #   velocity_smoother.min_velocity[0]=-0.20 同值钳制。
                                               #   注：PathAngleCritic 按 vx_min<0 自动放开倒车
                                               #   （path_angle_critic.cpp:30，日志由
                                               #   "Reversing not allowed" 变 "Reversing allowed"）
      wz_max: 0.8                              # 角速度上限，与 velocity_smoother 一致
      ax_max: 0.3                              # 缓起步（与 RPP max_linear_accel 一致）
      ax_min: -1.5                             # 制动上限
      az_max: 1.0                              # 角加速度上限
      iteration_count: 1                       # 单轮精化（低速场景足够）
      prune_distance: 3.0                      # V0.0.98：1.5 → 3.0，与 4s 预测时域匹配
                                               #   （旧值会把全局路径 1.5m 外的段剪掉，
                                               #   绕障弧参照的路径点丢失→PathAlign 无参考）
      transform_tolerance: 0.2
      temperature: 0.3                         # 代价 softmax 温度
      gamma: 0.015                             # 控制平滑正则
      motion_model: "Ackermann"                # 阿克曼运动学模型（关键：匹配 HUNTER-SE 底盘）
      visualize: false
      visualize_all_sampled_traj: false
      draw_behaviors: false
      # ---- critics（权重 tuned for 低速阿克曼室内巡航） ----
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
      CostCritic:
        enabled: true
        cost_weight: 6.0                       # V0.0.98：3.0 → 6.0。近障避让主权重，与
                                               #   PathAlignCritic 降权联动（"贴路径走"让位于
                                               #   "贴障碍躲"）；配合 safety_guard 扫掠弧闸 ——
                                               #   控制层选弧、安全层验弧，两层同向
        max_cost: 1000000
        consider_footprint: true               # 用车体矩形（含后悬）判碰撞，比圆形更准
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_weight: 8.0                       # V0.0.98：14.0 → 8.0。旧权重相对 CostCritic(3.0)
                                               #   高达 4.7:1，MPPI 被锁死在"严格贴合全局路径"
                                               #   上——绕障横移 0.4~0.9m 的可行弧全被判高代价，
                                               #   只剩"顶到障碍前才停"的贪心解（日志满舵死磕的
                                               #   控制层根因）。8.0 仍为各 critic 最大（路径跟踪
                                               #   仍是主目标），但允许局部绕障弧胜出
        max_path_occupancy_ratio: 0.15         # V0.0.98：0.05 → 0.15。轨迹经过的栅格占代价格
                                               #   比例阈值——绕障弧必然穿越膨胀区（inflation
                                               #   cost>0 的"占据"），旧值 0.05 使任何离径绕行
                                               #   直接被判不可行
        trajectory_point_dist: 0.3
        path_dist_weight: 3.0
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        offset_weight: 10.0
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_weight: 2.0
        offset_angle: 0.8
        threshold_to_consider: 0.5
        forward_opposing_weight: 2.0
        reverse_opposing_weight: 0.5
        reverse_penalty_weight: 0.5            # V0.0.97：1.0 → 0.5（配合 vx_min=-0.20）——
                                               #   倒车时的"逆向代价"过高会让 MPPI 在窄处
                                               #   宁可原地不动也不后退脱困
      PreferForwardCritic:
        enabled: true
        cost_weight: 1.0                       # V0.0.98：1.5 → 1.0。进一步降低"前进偏好"，
                                               #   让"先倒 0.3~0.5m 换提前量再打舵绕过"的
                                               #   多段机动在采样中真正可选中（1.5 实测仍偏向
                                               #   前进贪心解）；保留小权重防无意义倒车
        threshold_to_consider: 0.5

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"   # 必填：缺失即 FATAL "Can not get 'plugin' param value for general_goal_checker"
      stateful: true
      xy_goal_tolerance: 0.1                   # 文档 10.2.3：目标距离容差
      yaw_goal_tolerance: 0.15                 # 文档 10.2.3：目标角度容差

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

# ---- 全局代价地图（文档 8.3） ----
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0                    # V0.0.82：原 1.0，配合 BT 2Hz 重规划
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1                          # 文档 8.3：分辨率 0.1m
      width: 100                               # 文档 8.3：100m × 100m（Nav2 Humble 要求 integer）
      height: 100
      # V0.0.87 越界防护（地图边界约束第①层）：保留静态地图中未采集区域为
      # NO_INFORMATION（默认 false 会把 unknown 当作自由空间 → 规划器可穿越
      # 未建图区域）。配合 Smac allow_unknown=false：全局规划路径不进入
      # 未采集区域；目标点在未采集区域/地图外时规划直接失败（BT 快速回报），
      # 不再出现"路径悄悄伸到地图边缘外"的情况
      track_unknown_space: true
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.37, -0.32], [-0.37, 0.32] ]"   # 文档 9.3
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true    # Humble：map_server 以 transient_local 发 /map，默认 volatile 订阅将收不到地图
      # V0.0.82 双障碍源冗余：原单一 lidar_cloud（lidar_perception 聚类输出）
      # 为单点故障——地面分割/聚类异常时障碍层全空 → 全局无避障。补第二源
      # /scan（pointcloud_to_laserscan 高度切片直出，不经聚类，且带清障能力）
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # 必填：loadPlugins() 缺失即 FATAL "Can not get 'plugin' param"
        enabled: true
        footprint_clearing_enabled: true        # V0.0.97 显式声明（默认即 true，此处固化以求可读）：
                                                #   每周期清除车体 footprint 内的观测标记。
                                                #   与 V0.0.97 range_min 0.70（原 0.8）配套——车体
                                                #   自反射实测可达 ~0.6m，减小 range_min 后自反射点
                                                #   更可能进入扫描云；本开关是"车脚底被自己标成
                                                #   致命栅格"（→ Starting point in lethal space）
                                                #   的关键防线，勿关
        observation_sources: "lidar_cloud scan"   # Humble：ObstacleLayer 将该参数声明为空格分隔字符串，写成 YAML 列表会报 string_array 类型冲突
        lidar_cloud:
          topic: /perception/lidar/obstacle_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.3                 # V0.0.89 抬高至底盘/地面之上（原 0.0），避免近地杂波把车脚底标致命
          max_obstacle_height: 1.5
          marking: true
          clearing: true                      # V0.0.91 必须开清障！原 false 使假障碍只增不减：
                                              # 遥控接管后车身下方变成“永久致命栅格”，
                                              # clear_entirely 清完又被下一帧重标，
                                              # 所有航点持续报 Starting point in lethal space，
                                              # 车辆原地锁死不能自主（现场问题②直接成因）
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.25            # V0.0.98：0.5 → 0.25（断流容忍 2s→4s）。日志实测
                                                #   CPU 饥饿时 obstacle_cloud 缓冲积压到 1.8~2.8s，
                                                #   旧值 2s 超时→整帧丢弃→障碍层短暂全空（危险）
                                                #   或反复"observation buffer has not been
                                                #   updated"告警；放宽后仅拖慢新鲜度，不丢观测
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true                      # 射线清障：障碍移除后痕迹自动消退
          inf_is_valid: true                    # use_inf 投影的 inf 视为该方向无障碍
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.25            # V0.0.98：0.5 → 0.25，理由同上（/scan 10Hz，
                                                #   4s ≈ 丢 40 帧内不判陈旧；碰撞兼有 safety_guard
                                                #   直读 /scan + 自身 scan_timeout=0.5s 兜底，
                                                #   costmap 层放宽不降安全）
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40                 # V0.0.82：原 0.35，加大缓冲（≥内切半径 0.33+余量）
        cost_scaling_factor: 3.0

# ---- 局部代价地图（文档 8.3） ----
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0                   # V0.0.82：原 5.0，高速/贴近障碍场景更快反应
      publish_frequency: 5.0                   # 原 2.0
      # V0.1.00 新增：auto_mission 的"车身四周/脚底假障碍占位"诊断（需求②）订阅
      # /local_costmap/costmap（nav_msgs/OccupancyGrid 整图）。Costmap2DPublisher
      # 默认只在"窗口几何变化"时发整图、平时只发 *_updates（见
      # nav2_costmap_2d/src/costmap_2d_publisher.cpp 的 publishCostmap()），而车辆
      # 停驻待诊断时恰恰是"几何不变、只有代价变化"的场景 → 不开本项则诊断永远收到
      # 过期图，假障碍判据失效。开销：200×200 格 @5Hz ≈ 0.2 MB/s（本机 DDS，可忽略）。
      # ⚠ 关闭此项时 self_check_enable 的诊断结论会自动降级为"数据过期·不可判定"，
      #   不会误判，但也不会再自动清图。
      always_send_full_costmap: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      resolution: 0.05                         # 文档 8.3：分辨率 0.05m
      width: 10                                # 文档 8.3：10m × 10m（Nav2 Humble 要求 integer）
      height: 10
      footprint: "[ [0.45, 0.32], [0.45, -0.32], [-0.37, -0.32], [-0.37, 0.32] ]"   # 文档 9.3
      plugins: ["obstacle_layer", "inflation_layer"]
      # ⚠ V0.0.96 现场教训：局部代价地图为滚动窗口（odom 系）且**不含 static_layer**，
      #   即 MPPI 只能避开"实时感知到"的障碍，不会避开**仅存在于静态 PGM 地图中**的
      #   障碍（如建图时存在、现已移走的物体，或被车体/低矮结构遮挡的地图障碍）。
      #   现场表现：车被一路开到静态障碍的膨胀区内 → 之后 Smac 持续抛
      #   "Starting point in lethal space!"（起点格代价 LETHAL/INSCRIBED）→ 全线规划失败。
      #   本次不把 static_layer 加进滚动局部代价地图（StaticLayer 需 map 系非滚动窗口，
      #   改动风险大），改为三层防护：① 任务层航点净空校验（waypoint_clearance_m 0.50m）；
      #   ② 全局规划（Smac + 静态层）绕行；③ 行为树恢复池首位受限倒车脱困（V0.0.96）。
      # V0.0.82 双障碍源冗余（与 global_costmap 一致）：单一聚类点云源为
      # 单点故障；/scan 直采源带清障（clearing），感知链任一环异常时另一源兜底
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"   # 必填：loadPlugins() 缺失即 FATAL "Can not get 'plugin' param"
        enabled: true
        footprint_clearing_enabled: true        # V0.0.97 显式声明（默认即 true）：见 global_costmap
                                                #   同名注释——防自反射把车底标致命，勿关
        observation_sources: "lidar_cloud scan"   # Humble：ObstacleLayer 将该参数声明为空格分隔字符串，写成 YAML 列表会报 string_array 类型冲突
        lidar_cloud:
          topic: /perception/lidar/obstacle_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.3                 # V0.0.89 抬高至底盘/地面之上（原 0.0），避免近地杂波把车脚底标致命
          max_obstacle_height: 1.5
          marking: true
          clearing: true                      # V0.0.91 必须开清障！原 false 使假障碍只增不减：
                                              # 遥控接管后车身下方变成“永久致命栅格”，
                                              # clear_entirely 清完又被下一帧重标，
                                              # 所有航点持续报 Starting point in lethal space，
                                              # 车辆原地锁死不能自主（现场问题②直接成因）
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.25            # V0.0.98：0.5→0.25，与 global_costmap 同理
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_range: 3.0
          raytrace_range: 4.0
          expected_update_rate: 0.25            # V0.0.98：0.5→0.25（断流容忍 4s，防观测洞）
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45                 # V0.0.98：0.40 → 0.45，与 safety_guard 扫掠弧的
                                               #   包络半宽（0.32+0.12=0.44m）对齐——控制层代价场
                                               #   与安全层硬闸同一几何尺度，两层判据同向
        cost_scaling_factor: 3.0

# ---- 行为树导航器（文档 2.3 nav2_bt_navigator） ----
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /localization/odom
    bt_loop_duration: 20                       # V0.0.82：10ms 在 Jetson 上偏紧（"Behavior Tree tick
                                               # rate was exceeded" 刷屏），放宽到 20ms
    default_server_timeout: 20
    # ⚠️ 勿在此设置 plugin_lib_names：该参数一旦设置将【整体覆盖】bt_navigator 代码
    # 内置的全量 BT 插件列表（nav2_bt_navigator/src/bt_navigator.cpp，49 项）。
    # 旧配置的手写列表缺 nav2_remove_passed_goals_action_bt_node，导致激活时加载
    # 默认 navigate_through_poses_w_replanning_and_recovery.xml 报
    # "Node not recognized: RemovePassedGoals" → lifecycle_manager 中止 bringup。
    # 默认行为树由 bt_navigator 自行解析：可选手动覆盖参数名为
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml（未设置即用默认）。

# ---- 速度平滑器（文档 10.2.3 速度限制；V0.0.82 与 controller/safety_guard 对齐） ----
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.8]     # V0.0.89 测试场地：线速度上限 0.5m/s（原 0.8，与 MPPI vx_max 一致），角速度 0.8rad/s
    # ⚠ V0.0.95 线性下限 0.0 → -0.20（关键）：本节点对【所有】速度源统一做绝对值钳制
    #   （velocity_smoother.cpp applyConstraints 前的 std::clamp），min_velocity[0]=0.0
    #   会把行为树 BackUp（倒车脱困）的负线速度直接钳成 0 —— 表现为“恢复行为报成功
    #   但车不倒”，V0.0.94 现场即因此彻底失去倒车脱困能力。
    # V0.0.97：本值同时是 MPPI vx_min 的硬上限（MPPI 已放开 vx_min=-0.20 用于绕障
    #   与多点掉头）——两者必须同值，否则 MPPI 规划出倒车但被本节点钳成 0，
    #   表现为"车辆原地不动、控制器无输出"。改任一必须同步另一。
    min_velocity: [-0.20, 0.0, -0.8]
    max_accel: [0.3, 0.0, 1.0]        # V0.0.89 与 RPP 一致，减小起步冲击
    max_decel: [-1.5, 0.0, -1.5]      # V0.0.89 0.5m/s 下足够制动
    odom_topic: "/localization/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5             # 原 1.0：断流 0.5s 即零速（下游 safety_guard 同周期看门狗双保险）

