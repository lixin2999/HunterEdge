# relocalization_params.yaml — 方案A 全局 NDT 重定位（V0.0.93）
# 节点：hunter_relocalization/ndt_relocalization_node
# 职责：将 FAST-LIO2 实时点云（odom 系）配准到先验 .pcd（map 系），发布 map→odom TF。
hunter_relocalization:
  ros__parameters:
    # 全局点云地图绝对路径（建图产物；与 nav2 map_server 的 .yaml 同名换 .pcd 后缀）
    # 由 hunter_autonomous_nav.launch.py 依 map_yaml_path 自动派生注入；单独调试时可在此填写
    global_map_path: ""

    world_frame: map          # NDT 目标系（全局地图）
    odom_frame:  odom         # NDT 源系（FAST-LIO2 实时云所在，帧名已归一）
    cloud_topic: /cloud_registered
    publish_rate: 2.0         # Hz：NDT 计算较重，低频持续修正足够

    accumulate_window: 2.0    # s：滚动累积局部子图的时间窗
    target_voxel_size: 0.5    # m：全局地图降采样体素（大图必做，控内存/耗时）
    source_voxel_size:  0.25  # m：局部子图降采样体素

    # ---- NDT 求解器 ----
    ndt_resolution:   1.0     # m：NDT 体素分辨率
    ndt_step_size:    0.1     # 线搜索步长
    ndt_epsilon:      0.01    # 收敛阈值（变换增量）
    ndt_max_iterations: 30

    # ---- 收敛 / 跳变闸门（V0.1.03：跟踪与置信度彻底解耦）----
    # 是否刷新 map→odom 位姿只由 max_step_translation/max_step_rotation（跳变闸门 step_ok）决定，
    # 绝不用 fitness 冻结位姿——否则车一动 fit 越过阈值即冻结→局部云相对冻结位姿越走越偏→fit 更高→
    # 永不回弹的死亡螺旋（本例静止 fit≈1.65、起步即冲到 3.006 越过旧 ceiling=3.0 而锁死、fit 发散到 5.7）。
    # fitness_max：仅影响对外置信度（协方差，供 auto_mission 判“可否巡航”），不再冻结位姿。
    # 运动时 2s 滚动窗口拼接点云畸变会抬高 fit（本例稀疏地图 ~1600 点、1m NDT：静止~1.65、行驶中 2~3），
    # 静止收敛仅 0.02~0.4。取 3.5 容纳行驶期 fit 基线，避免正常行驶被误判未收敛而秒退 IDLE。
    fitness_max:          3.5   # 2.5→3.5：容纳稀疏地图行驶期 fit 基线（位姿仍无条件自适应跟踪）
    max_step_translation: 0.5   # m/周期：单周期平移跳变上限（防瞬移）——这才是唯一能拒绝位姿刷新的闸门
    max_step_rotation:    0.35  # rad/周期：单周期旋转跳变上限
    converged_covariance: 0.01  # 收敛时 /relocalization/pose 协方差（auto_mission 门控 <0.10 判收敛）
    # 连续失败去抖：连续 N 个周期 fit>fitness_max 才对外宣告“未收敛”（大协方差），其间仍保持收敛态；
    # 无论是否宣告未收敛，位姿都照常刷新（仅跳变 step_ok=false 才维持旧位姿）。2Hz 下 5 帧≈2.5s。
    diverge_tolerance_cycles: 5
    # 硬失效 ceiling：fit 超过此值视为严重失准（地图/初始位姿不一致），跳过去抖立即对外宣告未收敛。
    # ⚠ V0.1.03 起此值仅影响置信度，不再参与位姿跟踪门控（位姿仍刷新以便 NDT 自动回弹）。应 > fitness_max。
    fitness_hard_ceiling: 5.0   # 3.0→5.0：仅作严重失准的置信度门限，不再冻结位姿
