# =============================================================================
# autonomous_nav_params.yaml
# AUTO 模式自主导航全局配置
# 适用包：auto_mission（auto_mission_node）
# 适用车型：HUNTER-SE（阿克曼，最大速度 2.0 m/s，最小转弯半径 1.9 m）
# =============================================================================

auto_mission_node:
  ros__parameters:

    # -------------------------------------------------------------------------
    # 运行模式
    #   waypoint_loop : 本地预设航点列表自动循环巡航（方式A）
    #   external      : 等待外部通过 /navigate_to_pose action 下发目标（方式B）
    #   mapping       : 建图模式，不下发导航目标，FAST-LIO2 在线建图
    # -------------------------------------------------------------------------
    mission_mode: "waypoint_loop"

    # -------------------------------------------------------------------------
    # 安全距离约束（单位：m）
    #   warn_obstacle_dist : 前向扇区内障碍物距离低于此值 → 进入 OBSTACLE_AVOID，
    #                        Nav2 RPP 自然减速，等待障碍物清除
    #   stop_obstacle_dist : 前向扇区内障碍物距离低于此值 → 立即触发 ESTOP
    #   obstacle_fov_deg   : 前向检测扇区半角（total FOV = 2×obstacle_fov_deg/2），
    #                        base_link 坐标系 x 轴前方
    # -------------------------------------------------------------------------
    warn_obstacle_dist: 2.0          # 减速警告距离（m）
    stop_obstacle_dist: 0.8          # 急停距离（m）
    obstacle_fov_deg: 120.0          # 检测扇区（°），前向 ±60°

    # -------------------------------------------------------------------------
    # 定位收敛判断
    #   localize_cov_threshold : EKF 输出位姿协方差迹（x+y+yaw 对角元素之和）
    #                            小于此值认为定位收敛，允许执行导航
    #   localize_wait_timeout  : 等待定位收敛的最大时间（s），超时则告警停车回 IDLE
    # -------------------------------------------------------------------------
    localize_cov_threshold: 0.5      # 协方差迹阈值
    localize_wait_timeout: 10.0      # 最长等待时间（s）

    # -------------------------------------------------------------------------
    # 感知健康度
    #   perception_timeout : /perception/fused_objects 话题超过此时间无新数据，
    #                        认为感知全部失效，禁止/停止导航
    # -------------------------------------------------------------------------
    perception_timeout: 2.0          # 感知超时阈值（s）

    # -------------------------------------------------------------------------
    # 航点巡航行为
    #   loop_waypoints        : true  → 所有航点完成后循环重来
    #                           false → 完成后停车进入 IDLE
    #   max_wp_failures       : 单次巡航中允许的连续航点失败次数上限，超出则停车
    #   goal_timeout          : 单个航点导航的最大允许时间（s），超时跳过该航点
    #   obstacle_wait_timeout : OBSTACLE_AVOID 状态下等待障碍物清除的最大时间（s），
    #                           超时触发 ESTOP
    # -------------------------------------------------------------------------
    loop_waypoints: true
    max_wp_failures: 3
    goal_timeout: 60.0               # 单点导航超时（s）
    obstacle_wait_timeout: 30.0      # 障碍物等待超时（s）

    # -------------------------------------------------------------------------
    # 速度约束（仅合规性检查，实际限速由 nav2_params.yaml controller/velocity_smoother 控制）
    # 文档规定：HUNTER-SE 最大速度 ≤ 2.0 m/s
    # -------------------------------------------------------------------------
    max_velocity: 1.5                # 建议巡航速度（m/s），≤ 2.0

    # -------------------------------------------------------------------------
    # 本地预设航点列表（mission_mode: waypoint_loop 时生效）
    # 格式：每条字符串 "x,y,yaw_rad,label"
    #   x, y  : map 坐标系下的目标位置（m）
    #   yaw   : 到达目标时的朝向（弧度，0=正东/正X方向，π/2=正北/正Y方向）
    #   label : 便于日志识别的名称（可含中文，不含逗号）
    #
    # ⚠ 注意：以下坐标为示例占位值，实际部署前必须根据现场建图结果替换！
    #   建议流程：
    #     1. 运行建图模式录制地图
    #     2. 用 rviz2 在地图上确认各巡检点坐标
    #     3. 将真实坐标填入此处
    # -------------------------------------------------------------------------
    waypoints:
      - "0.0,0.0,0.0,起点"
      - "5.0,0.0,0.0,检查点A"
      - "5.0,5.0,1.5708,检查点B"
      - "0.0,5.0,3.1416,检查点C"
      - "0.0,0.0,0.0,返回起点"

    # -------------------------------------------------------------------------
    # 建图模式参数（autonomous_nav_mode: mapping 时生效）
    # -------------------------------------------------------------------------
    # FAST-LIO2 在线建图输出 PCD 保存配置
    # 说明：fast_lio2 通过参数 pcd_save_en=true + map_file_path 控制建图保存
    #       结束建图时发送 SIGINT（Ctrl+C）触发保存
    pcd_save_en: true
    map_file_path: "/home/agilex/HunterEdge/maps/hunter_map.pcd"  # 地图保存绝对路径
    pcd_save_interval: -1    # -1: 全部帧保存为单文件；>0: 每 N 帧保存一次（内存受限时使用）

    # 建图时关闭 Nav2 代价地图更新以节省计算资源
    disable_costmap_during_mapping: true

    # -------------------------------------------------------------------------
    # 导航模式参数（autonomous_nav_mode: nav 时生效）
    # -------------------------------------------------------------------------
    # 加载已保存的静态地图文件（PGM+YAML 格式，由 nav2_map_server 加载）
    # 注意：map_yaml_path 指向 .yaml 元数据文件，同目录下需有同名 .pgm 栅格文件
    map_yaml_path: "/home/agilex/HunterEdge/maps/hunter_map.yaml"

    # 本系统已有 FAST-LIO2+EKF 作为定位源，默认不启动 AMCL
    use_amcl: false

    # 代价地图障碍物来源（与 nav2_params.yaml 一致）
    costmap_obstacle_topic: "/perception/lidar/obstacle_cloud"
