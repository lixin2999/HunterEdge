# =============================================================================
# autonomous_nav_params.yaml
# AUTO 模式自主导航全局配置
# 适用包：auto_mission（auto_mission_node）
# 适用车型：HUNTER-SE（阿克曼，最大速度 2.0 m/s，最小转弯半径 1.9 m）
# =============================================================================

auto_mission_node:
  ros__parameters:

    # -------------------------------------------------------------------------
    # 运行模式
    #   waypoint_loop : 本地预设航点列表自动循环巡航（方式A）
    #   external      : 等待外部通过 /navigate_to_pose action 下发目标（方式B）
    #   mapping       : 建图模式，不下发导航目标，FAST-LIO2 在线建图
    # -------------------------------------------------------------------------
    mission_mode: "waypoint_loop"

    # -------------------------------------------------------------------------
    # 安全距离约束（单位：m）
    #   warn_obstacle_dist : 前向扇区内障碍物距离低于此值 → 进入 OBSTACLE_AVOID，
    #                        Nav2 MPPI 自然减速，等待障碍物清除
    #   stop_obstacle_dist : 前向扇区内障碍物距离低于此值 → 立即触发 ESTOP
    #   obstacle_fov_deg   : 前向检测扇区半角（total FOV = 2×obstacle_fov_deg/2），
    #                        base_link 坐标系 x 轴前方
    # -------------------------------------------------------------------------
    warn_obstacle_dist: 1.5          # V0.0.89 减速警告距离（m，原 2.0，窄场地尺度）
    stop_obstacle_dist: 0.6          # V0.0.89 急停距离（m，原 0.8，略大于 footprint 前缘 0.45）
    obstacle_fov_deg: 120.0          # 检测扇区（°），前向 ±60°

    # -------------------------------------------------------------------------
    # 定位收敛判断
    #   localize_cov_threshold : 里程计（/localization/odom）位姿协方差迹
    #                            （x+y+yaw 对角元素之和）小于此值认为里程计收敛
    #   amcl_cov_threshold     : V0.0.93 方案A 语义改为全局重定位（NDT）。
    #                            hunter_relocalization 发布 /relocalization/pose：
    #                            收敛时 covariance[0]=[7]=0.01（和=0.02），
    #                            未收敛时=100（和=200）。此阈值 0.10 清晰区分两者：
    #                            ≤ 0.10 才允许进入导航。成员/参数名沿用 amcl_* 前缀。
    #   localize_wait_timeout  : 等待定位收敛的最大时间（s）。NDT 首帧配准即可收敛，
    #                            保留 15s 供大场景首帧充分扫到特征。
    # -------------------------------------------------------------------------
    localize_cov_threshold: 0.5      # 里程计协方差迹阈值
    amcl_cov_threshold: 0.10         # V0.0.93 全局重定位(NDT) x+y 方差和收敛阈值
    localize_wait_timeout: 15.0      # 最长等待时间（s）

    # -------------------------------------------------------------------------
    # 感知健康度
    #   perception_timeout : /perception/fused_objects 话题超过此时间无新数据，
    #                        认为感知全部失效，禁止/停止导航
    # -------------------------------------------------------------------------
    perception_timeout: 2.0          # 感知超时阈值（s）

    # -------------------------------------------------------------------------
    # 航点巡航行为
    #   loop_waypoints        : true  → 所有航点完成后循环重来
    #                           false → 完成后停车进入 IDLE
    #   max_wp_failures       : 单次巡航中允许的连续航点失败次数上限，超出则停车
    #   goal_timeout          : 单个航点导航的最大允许时间（s），超时跳过该航点
    #   obstacle_wait_timeout : OBSTACLE_AVOID 状态下等待障碍物清除的最大时间（s），
    #                           超时触发 ESTOP
    # -------------------------------------------------------------------------
    loop_waypoints: true
    max_wp_failures: 3
    goal_timeout: 45.0               # V0.0.95 90→45：受阻由 stall_detect_time 提前捕获（25s 内定性），
                                     # 本超时只兜底"缓慢但可达"的航点，避免单点卡死占用 90s
    obstacle_wait_timeout: 30.0      # 障碍物等待超时（s）

    # -------------------------------------------------------------------------
    # V0.0.95 航点预检与受阻（无法绕行）检测 —— 修"开启自主巡航车辆原地抖动不前进"
    #   already_reached_dist : 航点"已到达"判定半径（m）。航点与当前 map 系位姿
    #       （/relocalization/pose）距离 ≤ 此值时视为该航点已完成，**跳过不发 goal**。
    #       必要性：goal 与自身位姿重合时，Smac 路径长度≈0 且要求终止朝向，
    #       阿克曼无法原地转向 → MPPI 持续打满转向、纵向零进挪 →
    #       ProgressChecker(0.1m/10s) 必报 Failed to make progress，BT 非运动
    #       恢复也救不了（V0.0.94 现场即航点[0]"起点"与车位仅差 0.19m）。
    #       取值须 > 阿克曼停车精度且 ≥ 2× Nav2 xy_goal_tolerance(0.10m)，默认 0.30。
    #       注：只判位置不判朝向——巡检任务不需要精确终点朝向，且朝向对齐
    #       依赖原地转向（阿克曼不可行），强判会重新引入死锁。
    #   stall_detect_time    : 受阻判定时长（s）。goal 在途且窗口内 map 系位移
    #       < stall_move_eps 时判"前方障碍无法绕行/航点无可达路径"，立即取消本
    #       goal 并按失败换点（连续达 max_wp_failures 则 FAULT 锁存）。
    #       取值须 > 一轮 Nav2 恢复周期（ProgressChecker 10s + 清图 + 受限倒车脱困），
    #       默认 25s；过小会打断行为树的倒车脱困重试。
    #   stall_move_eps       : 受阻判定位移下限（m），默认 0.15（>2× 定位抖动）。
    # -------------------------------------------------------------------------
    #       V0.0.97 取值 0.30 → 0.35：现场车与"起点"航点相距 0.304m，刚过旧阈值 →
    #       预检不判已到达 → 下发退化目标 → 被阻 25s 才放弃。0.35m 与
    #       Nav2 xy_goal_tolerance(0.10m) + R_min(1.9m) 的"可微调尺度"匹配；
    #       ⚠ 上限不宜 >0.4m，否则会跳过本应前往的近邻航点。
    already_reached_dist: 0.35
    stall_detect_time: 25.0
    stall_move_eps: 0.15
    #   stall_path_allow_m   : V0.0.97 新增（m），默认 1.0。受阻判据的【绕障机动宽容】：
    #       自本 goal 发出起累计行程（map 系 |Δ位姿| 之和）≥ 本值时，即使净推进
    #       < stall_move_eps 也【不判受阻】——因为 V0.0.97 放开倒车（MPPI vx_min=-0.20）
    #       与 Smac REEDS_SHEPP 后，正常绕障是"倒 0.4m → 进 0.5m → 再倒"的多段机动，
    #       净推进可能长期很小（倒车时到目标距离反而增大）。
    #       真兜底改为单航点超时 goal_timeout(45s)：长时间"在动但绕不过"仍会换点。
    #       取值须 > stall_move_eps（内部有合法性校验，过小时自动抬到 2× stall_move_eps）。
    stall_path_allow_m: 1.0

    # -------------------------------------------------------------------------
    # V0.0.96 航点净空（膨胀）校验 —— 修"车开到静态障碍旁后全部规划失败"
    #   waypoint_clearance_m : 航点距最近【占据栅格】的最小欧氏距离（m），默认 0.50。
    #   必要性（V0.0.95 实车日志）：航点 (5.0,0.0) 落在静态地图障碍的膨胀区内 →
    #     Nav2 局部代价地图为滚动窗口且不含 static_layer，MPPI 不会避开仅存在于静态
    #     地图中的障碍，车被一路开到该点停下；此后 SmacPlannerHybrid 的
    #     areInputsValid() 判起点格无效（代价 LETHAL 254 / INSCRIBED 253），持续抛
    #     "Starting point in lethal space! Cannot create feasible plan." → 该点出发的
    #     所有航点全部 ABORT，3 次后 FAULT 锁存（清图无效：StaticLayer::reset() 只置
    #     has_updated_data_，静态障碍会被重新盖章）。
    #   取值约束：必须 > Nav2 内切半径（本车 footprint 半宽 0.32m）+ 定位误差余量；
    #     建议 0.5（= inflation_radius 0.40 + 0.10 余量）。改小会在障碍旁制造死局。
    #   校验动作：发送前若航点为占据栅格 / 距占据栅格 < 本值 → 拒绝并跳过该航点，
    #     日志给出实测净空（如"距静态地图障碍仅 0.18m < 净空要求 0.50m"）；
    #     全部航点均被拒 → FAULT 锁存并要求重标航点。
    # -------------------------------------------------------------------------
    waypoint_clearance_m: 0.50

    # -------------------------------------------------------------------------
    # Nav2 就绪门控
    #   nav_active_wait_timeout : NAVIGATING 中等待 bt_navigator 激活的超时（s），
    #                             超时回 IDLE（Nav2 bringup 常规 <30s）
    #   nav_retry_backoff       : goal 被拒/失败后的重试退避（s），防止高频重发
    # -------------------------------------------------------------------------
    nav_active_wait_timeout: 60.0
    nav_retry_backoff: 3.0           # V0.0.89 goal 被拒/失败后重试退避（原 2.0），窄场地避免高频重发刷屏

    # -------------------------------------------------------------------------
    # 速度约束（仅合规性检查，实际限速由 nav2_params.yaml controller/velocity_smoother 控制）
    # 文档规定：HUNTER-SE 最大速度 ≤ 2.0 m/s
    # -------------------------------------------------------------------------
    max_velocity: 0.5                # 巡航速度（m/s），V0.0.89 与 controller desired_linear_vel/velocity_smoother 一致

    # -------------------------------------------------------------------------
    # 建图模式自动巡航（mapping auto cruise）
    #
    # 用途：建图模式下车辆沿 rviz 点击的航点自动巡航采集点云，无需遥控驾驶。
    # 使用：rviz2 "Publish Point" 点击航点（Fixed Frame 必须为 odom，
    #       与 FAST-LIO2 /Odometry 反馈同源）后，调用
    #       ros2 service call /auto_mission/start_mapping_cruise std_srvs/srv/Trigger
    # 停止：ros2 service call /auto_mission/stop_mapping_cruise std_srvs/srv/Trigger
    #       或遥控接管（切 REMOTE，巡航暂停保持 MAPPING）/ 急停。
    # -------------------------------------------------------------------------
    # params_file 由 launch 传入（与 waypoint_recorder 写入的是同一文件），无需在此配置
    params_file: ""                  # 占位；实际值来自 launch 的 auto_params_file
    cruise_max_speed: 0.1            # 巡航直行最大速度（m/s）；首跑安全临时值（≈慢步速），确认平稳后逐步回调 0.5 → 1.0
    cruise_turn_speed: 0.4           # 航向偏差 > cruise_yaw_slow_deg 时的限速（m/s）
    cruise_min_speed: 0.05           # 接近航点减速下限（m/s），避免临门蠕动；保持 ≤ cruise_max_speed（恢复巡航速度时同步回调，如 0.2）
    cruise_reach_dist: 0.6           # 到达判定距离（m），需 ≥ 阿克曼停车精度
    cruise_brake_dist: 2.0           # 接近目标开始线性减速的距离（m）
    cruise_kp_yaw: 1.2               # 航向 P 增益
    cruise_max_yaw_rate: 0.5         # 最大角速度（rad/s），硬上限
    cruise_yaw_slow_deg: 45.0        # 航向偏差超过此角度降速（度）
    cruise_min_turn_radius: 1.9      # HUNTER-SE 最小转弯半径（m），|w| ≤ v/R
    cruise_cmd_rate: 20.0            # /cmd_vel 发布频率（Hz），需覆盖底盘 cmd_vel_timeout
    cruise_odom_timeout: 1.0         # /Odometry 超时（s），超时停车等待


    # 本地预设航点列表（mission_mode: waypoint_loop 时生效）
    # 格式：每条字符串 "x,y,yaw_rad,label"
    #   x, y  : map 坐标系下的目标位置（m）
    #   yaw   : 到达目标时的朝向（弧度，0=正东/正X方向，π/2=正北/正Y方向）
    #   label : 便于日志识别的名称（可含中文，不含逗号）
    #
    # ⚠ 注意：以下坐标为示例占位值，实际部署前必须根据现场建图结果替换！
    #   建议流程：
    #     1. 运行建图模式录制地图
    #     2. 用 rviz2 在地图上确认各巡检点坐标
    #     3. 将真实坐标填入此处
    # ⚠ V0.0.95 航点布置约束（务必遵守，否则任务会锁存 FAULT）：
    #   ① 首个航点不得与车辆起始位姿重合（0.30m 内）。车辆本身在起点时，
    #      "起点"航点会被 already_reached_dist 预检跳过（属正常，见上方参数注释）；
    #      但若【所有】航点都落在车辆当前位姿 0.30m 内，任务无事可做 → FAULT 锁存。
    #   ② 航点朝向上的朝向差只作提示，不参与"已到达"判定。
    #   ③ 相邻航点间距建议 ≥ 2m，避免"跳过预检"把有效航点误判为已到达。
    # ⚠ V0.0.96 航点必须在【自由且净空充足】的区域（务必遵守）：
    #   每个航点距静态地图中的障碍（占据栅格）必须 ≥ waypoint_clearance_m（默认 0.50m），
    #   否则发送前即被拒（日志给出实测净空），因为停在该点会让 Smac 持续抛
    #   "Starting point in lethal space!" 而死局。标定方法：
    #     1) rviz2 加载 /map，放大确认目标点四周 ≥0.5m 无黑色（占据）栅格；
    #        ⚠ 本仓库示例航点 (0,0)/(5,0)/(5,3)/(0,3) 是**占位值**，已确认在实车地图上
    #        (5,0) 落在障碍膨胀区内 → 实车部署必须用下面方法重新标定。
    #     2) 建图模式 rviz2 "Publish Point" 点击（Fixed Frame=odom，写回本文件）；
    #     3) 重启后看 auto_mission 日志：若仍提示"距静态地图障碍仅 x.xxm < 净空要求"，
    #        按提示把该点往空旷处挪 ≥0.5m 再试。
    # -------------------------------------------------------------------------
    waypoints:
      - "0.0,0.0,0.0,起点"
      - "5.0,0.0,0.0,检查点A"
      # V0.0.82：检查点B/C 原 (5,5)/(0,5) 的 y=5 超出静态地图边界（实测 hunter_map
      # y∈[-12.95,+3.85]，含 0.5m 安全边距后 y≤3.35），必报 "Goal pose is out of
      # costmap!"。下方 y=3.0 为占位修正值，实车部署请用建图模式 rviz
      # "Publish Point" 重新标定真实巡检点（运行时 auto_mission 也会按 /map 边界校验）。
      - "5.0,3.0,1.5708,检查点B"
      - "0.0,3.0,3.1416,检查点C"
      - "0.0,0.0,0.0,返回起点"

    # -------------------------------------------------------------------------
    # 建图模式参数（autonomous_nav_mode: mapping 时生效）
    # -------------------------------------------------------------------------
    # FAST-LIO2 在线建图输出 PCD 保存配置
    # 说明：fast_lio2 通过参数 pcd_save_en=true + map_file_path 控制建图保存
    #       结束建图时发送 SIGINT（Ctrl+C）触发保存
    pcd_save_en: true
    map_file_path: "/home/agilex/HunterEdge/maps/hunter_map.pcd"  # 地图保存绝对路径
    pcd_save_interval: -1    # -1: 全部帧保存为单文件；>0: 每 N 帧保存一次（内存受限时使用）

    # 建图时关闭 Nav2 代价地图更新以节省计算资源
    disable_costmap_during_mapping: true

    # -------------------------------------------------------------------------
    # 导航模式参数（autonomous_nav_mode: nav 时生效）
    # -------------------------------------------------------------------------
    # 加载已保存的静态地图文件（PGM+YAML 格式，由 nav2_map_server 加载）
    # 注意：map_yaml_path 指向 .yaml 元数据文件，同目录下需有同名 .pgm 栅格文件
    map_yaml_path: "/home/agilex/HunterEdge/maps/hunter_map.yaml"

    # 全局定位（map→odom）由 hunter_relocalization(NDT) 提供（V0.0.93 方案A）：
    # hunter_autonomous_nav.launch.py 启动 hunter_relocalization 将实时点云配准到
    # 先验 .pcd（与 map_yaml 同名），发布 map→odom；同时启动 pointcloud_to_laserscan
    # 供 costmap/safety 用。use_amcl 已废弃（AMCL 已移除），保留仅供旧配置兼容。
    use_amcl: false

    # 代价地图障碍物来源（与 nav2_params.yaml 一致）
    costmap_obstacle_topic: "/perception/lidar/obstacle_cloud"
